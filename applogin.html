<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Power Haazri — Gmail login</title>
<style>
:root{--ink:#1B2A4A;--gold:#E8A33D;--muted:#66728A;--bad:#C2453D;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);padding:20px;color:#1E2940}
.card{background:#fff;border-radius:14px;max-width:380px;width:100%;padding:28px 24px;text-align:center}
svg.logo{width:56px;height:56px}h1{font-size:1.25rem;margin:12px 0 6px}p{color:var(--muted);margin:0 0 20px;line-height:1.5}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.g{background:#fff;border:1px solid #DCE2EE;color:#1E2940}.go{background:var(--gold);color:var(--ink);font-size:1.05rem}
.err{color:var(--bad);font-size:.9rem;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <svg class="logo" viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#E8A33D"/><path d="M24 7l4.6 11.2L40.5 19l-9.1 7.7 2.9 11.8L24 32.1l-10.3 6.4 2.9-11.8L7.5 19l11.9-.8z" fill="#1B2A4A"/></svg>
  <h1 id="h">Power Haazri — Gmail login</h1>
  <p id="p">Apni Gmail chunein. Us ke baad aap wapas Power Haazri app mein chale jayenge.</p>
  <button class="btn g" id="pick">Gmail chunein</button>
  <a class="btn go" id="back" hidden>Power Haazri kholein</a>
  <div class="err" id="err" hidden></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const cfg = await (await fetch("./config.json", { cache: "no-store" })).json();
const auth = getAuth(initializeApp(cfg));
const prov = new GoogleAuthProvider(); prov.setCustomParameters({ prompt: "select_account" });
const $ = s => document.querySelector(s);
function err(m) { $("#err").textContent = m; $("#err").hidden = !m; }
function done(res) {
  const cred = GoogleAuthProvider.credentialFromResult(res);
  if (!cred || !cred.idToken) return err("Gmail se token nahi mila, dobara koshish karein.");
  const url = "powerhaazri://auth?t=" + encodeURIComponent(cred.idToken);
  $("#h").textContent = "Login kamyab"; $("#p").textContent = (res.user.email || "") + " — ab neeche button dabayein.";
  $("#pick").hidden = true; $("#back").hidden = false; $("#back").href = url;
  signOut(auth).catch(() => {});   // browser mein login baqi na rahe
  setTimeout(() => { location.href = url; }, 400);
}
getRedirectResult(auth).then(r => { if (r) done(r); }).catch(e => err("Login nahi hua: " + (e.code || e.message)));
$("#pick").onclick = async () => {
  err("");
  try { done(await signInWithPopup(auth, prov)); }
  catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") return signInWithRedirect(auth, prov);
    if (e.code !== "auth/popup-closed-by-user") err("Login nahi hua: " + (e.code || e.message));
  }
};
</script>
</body>
</html>
