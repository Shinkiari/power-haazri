<style>:root{--ink:#16233F;--ink2:#2C3E66;--gold:#E8A33D;--gold2:#F6D9A6;--paper:#F2F4F9;--line:#E1E6F0;--text:#1A2540;--muted:#69758C;--ok:#22875A;--okbg:#E2F4EA;--late:#B07408;--latebg:#FCF1DA;--bad:#C2453D;--badbg:#FBE6E4;--blue:#2F6FDB;--bluebg:#E6EFFD;--r:16px;font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2}
.brandlogo{display:block;flex:none}.brandlogo svg,.brandlogo img{width:100%;height:100%;display:block}.brandlogo img{object-fit:contain;border-radius:22%;background:#fff}
/* header */
.hero{background:radial-gradient(1200px 300px at 85% -40%,rgba(232,163,61,.28),transparent 60%),linear-gradient(135deg,#1E3160,#121C33);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 0 74px}
.hero-in{max-width:1140px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:14px}
.hero .brandlogo{width:52px;height:52px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.hero .bn b{display:block;font-size:1.15rem;letter-spacing:.01em}
.hero .bn span{font-size:.8rem;opacity:.72}
.hero .sp{flex:1}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;font-size:.85rem;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.hbtn:hover{background:rgba(255,255,255,.18)}
.hbtn svg{width:16px;height:16px}
.who{font-size:.78rem;opacity:.7;margin-right:4px}
.hero h1{max-width:1140px;margin:22px auto 0;padding:0 18px;font-size:1.5rem;font-weight:500}
.hero h1 b{color:var(--gold2);font-weight:600}
main{max-width:1140px;margin:-52px auto 0;padding:0 18px 60px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stats>div{background:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:0 8px 24px rgba(22,35,63,.08);display:flex;gap:12px;align-items:center;border:1px solid rgba(225,230,240,.7)}
.stats i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font-style:normal}
.stats i svg{width:21px;height:21px}
.stats b{display:block;font-size:1.45rem;font-weight:600;line-height:1.15}
.stats span{font-size:.78rem;color:var(--muted)}
.i1{background:var(--bluebg);color:var(--blue)}.i2{background:var(--okbg);color:var(--ok)}.i3{background:var(--latebg);color:var(--late)}.i4{background:#F1E8FB;color:#7A45C2}
/* cards */
.card{background:#fff;border:1px solid rgba(225,230,240,.9);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;box-shadow:0 2px 8px rgba(22,35,63,.04)}
.card h3{font-size:1.02rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chead h3{margin:0;flex:1}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:#B9C3D8;background:#FAFBFD}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.primary:hover{background:var(--ink2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1A2540;font-weight:600}.btn.gold:hover{background:#F0B04F}
.btn.soft{background:var(--bluebg);border-color:transparent;color:var(--blue)}
.btn.danger{color:var(--bad)}.btn.danger:hover{background:var(--badbg);border-color:#F0C6C2}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.input:focus{border-color:#9FB0D3;outline:none;box-shadow:0 0 0 3px rgba(47,111,219,.12)}
.field{display:block;margin-bottom:12px}.field>span{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 12px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:22px;padding:6px 15px;cursor:pointer;font-weight:500;font-size:.88rem}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.keybox{background:linear-gradient(135deg,#FFF8EA,#FDF1D8);border:1px dashed var(--gold);border-radius:12px;padding:14px 16px;margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.keybox code{font-size:1.35rem;font-weight:600;letter-spacing:.08em;flex:1;color:var(--ink)}
.search{flex:1 1 220px;max-width:300px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;font-size:.8rem;cursor:pointer;color:var(--muted)}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-weight:500;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
td{padding:12px 10px;border-bottom:1px solid #EEF1F7;vertical-align:top}
tr:last-child td{border:0}
#schTable tr:hover td{background:#FAFBFE}
.sname{display:flex;gap:10px;align-items:center}
.sav{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;font-size:.9rem;background:linear-gradient(135deg,#2C3E66,#16233F)}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:500;white-space:nowrap}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--latebg);color:var(--late)}.c-bad{background:var(--badbg);color:var(--bad)}.c-grey{background:#EDF0F6;color:var(--muted)}
.acts{display:flex;gap:5px;flex-wrap:wrap;max-width:430px}
.acts .grp{display:flex;gap:5px;flex-wrap:wrap;width:100%}
.muted{color:var(--muted)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 400px at 80% -10%,rgba(232,163,61,.3),transparent 60%),linear-gradient(135deg,#1E3160,#0F1830);padding:20px}
.login .card{max-width:380px;width:100%;text-align:center;padding:34px 28px;box-shadow:0 30px 60px rgba(0,0,0,.3);border:0}
.login .brandlogo{width:84px;height:84px;margin:0 auto 14px}
.login h2{font-size:1.3rem}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px}
.err{background:var(--badbg);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:.86rem;margin-top:12px}
.foot{text-align:center;color:var(--muted);font-size:.78rem;padding:10px 0 0}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,24,48,.55);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:#fff;border-radius:18px;max-width:460px;width:100%;padding:22px 24px;box-shadow:0 30px 70px rgba(0,0,0,.3)}
.mbox h3{margin-bottom:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1}
.lgprev{width:84px;height:84px;border-radius:18px;border:1px solid var(--line);padding:6px;background:#fff}
@media (max-width:860px){.stats{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}}
@media (max-width:640px){
  .hero{padding-bottom:64px}.hero .brandlogo{width:44px;height:44px}.hero .bn b{font-size:1rem;white-space:nowrap}.hero .bn span{font-size:.72rem;white-space:nowrap}.hero-in{gap:10px}.hero h1{font-size:1.2rem;margin-top:16px}.who{display:none}.hbtn .t{display:none}
  .stats{gap:10px}.stats>div{padding:12px;gap:10px}.stats i{width:36px;height:36px}.stats b{font-size:1.15rem}
  .card{padding:16px}.g4{grid-template-columns:1fr}
  #schTable,#schTable tbody,#schTable tr,#schTable td{display:block;width:100%}
  #schTable tr:first-child{display:none}
  #schTable tr{border:1px solid var(--line);border-radius:14px;padding:6px 4px;margin-bottom:12px}
  #schTable td{border:0;padding:6px 10px}
  #schTable td[data-l]:before{content:attr(data-l);display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .acts{max-width:none}
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, collection, query, where, orderBy, limit, onSnapshot, writeBatch, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = await (await fetch("./config.json", { cache: "no-store" })).json(); // config.json (isi folder mein)
const OWNER_EMAIL = "shinkiari45@gmail.com";
const APP_URL = "https://shinkiari.github.io/power-haazri/"; // client ko diya jane wala app link
const GRACE_DAYS = 3;

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = ms => new Date(ms).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const DAY = 864e5;
const TYPE = { trial: "Trial", period: "Muddat", year: "1 saal", life: "Lifetime" };
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2800); }
function normWa(p) { let d = String(p || "").replace(/\D/g, ""); if (d.startsWith("0")) d = "92" + d.slice(1); return d; }
function genKey() { const c = "23456789ABCDEFGHJKMNPQRSTUVWXYZ"; const r = [...crypto.getRandomValues(new Uint8Array(12))].map(x => c[x % c.length]).join(""); return r.match(/.{4}/g).join("-"); }
function modal(html) { $("#mbox").style.cssText = ""; $("#mbox").innerHTML = html; $("#modal").hidden = false; return $("#mbox"); }
const closeModal = () => { $("#modal").hidden = true; };
$("#modal").onclick = e => { if (e.target.id === "modal") closeModal(); };

let schools = [], keys = [], unsubs = [], curType = "trial", sFilter = "all";
$("#sSearch").oninput = () => render();
$("#sFilt").onclick = e => { const b = e.target.closest("button[data-f]"); if (!b) return; sFilter = b.dataset.f; [...$("#sFilt").children].forEach(x => x.classList.toggle("on", x === b)); render(); };
/* Brand: logo + naam (Firestore meta/brand, aur login screen ke liye local cache) */
const DEFAULT_LOGO = document.querySelector("[data-blogo]").innerHTML;
let brand = (() => { try { return JSON.parse(localStorage.getItem("pt_brand") || "{}"); } catch (e) { return {}; } })();
function paintBrand() {
  document.querySelectorAll("[data-blogo]").forEach(el => { el.innerHTML = brand.logo ? `<img src="${brand.logo}" alt="">` : DEFAULT_LOGO; });
  document.querySelectorAll("[data-bname]").forEach(el => { el.textContent = brand.name || "Power Technology"; });
  try { localStorage.setItem("pt_brand", JSON.stringify(brand)); } catch (e) {}
}
paintBrand();
async function shrinkImg(file) {
  if (!file || !/^image\//.test(file.type)) throw new Error("Sirf tasveer chunein");
  const url = await new Promise((r, j) => { const f = new FileReader(); f.onload = () => r(f.result); f.onerror = j; f.readAsDataURL(file); });
  const img = await new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => j(new Error("Tasveer nahi khuli")); i.src = url; });
  const sc = Math.min(1, 256 / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c.toDataURL("image/png");
}
$("#brandBtn").onclick = () => {
  let lg = brand.logo || "";
  const m = modal(`<h3>Brand — logo aur naam</h3><p class="muted" style="margin:0 0 14px;font-size:.88rem">Yeh owner panel aur login screen par nazar aata hai.</p>
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px"><span class="brandlogo lgprev" id="bPrev"></span>
      <div style="display:flex;flex-direction:column;gap:6px"><input type="file" accept="image/*" id="bFile" hidden><button class="btn sm" id="bPick">Naya logo chunein</button><button class="btn sm" id="bDef">Default Power Technology logo</button></div></div>
    <label class="field"><span>Naam</span><input class="input" id="bName" value="${esc(brand.name || "Power Technology")}"></label>
    <div class="acts" style="justify-content:flex-end;max-width:none"><button class="btn" id="mX">Wapas</button><button class="btn primary" id="mOk">Save</button></div>`);
  const pv = () => { m.querySelector("#bPrev").innerHTML = lg ? `<img src="${lg}" alt="">` : DEFAULT_LOGO; }; pv();
  m.querySelector("#bPick").onclick = () => m.querySelector("#bFile").click();
  m.querySelector("#bFile").onchange = async e => { try { lg = await shrinkImg(e.target.files[0]); pv(); } catch (err) { toast(err.message); } };
  m.querySelector("#bDef").onclick = () => { lg = ""; pv(); };
  m.querySelector("#mX").onclick = closeModal;
  m.querySelector("#mOk").onclick = async () => {
    brand = { logo: lg, name: m.querySelector("#bName").value.trim() || "Power Technology" }; paintBrand(); closeModal();
    try { await setDoc(doc(db, "meta", "brand"), brand); toast("Brand save ho gaya"); } catch (err) { toast("Save nahi hua: " + (err.code || err.message)); }

};

/* Status helper */
function status(l) {
  if (l.locked) return ["Band", "c-bad"];
  if (l.life) return ["Lifetime", "c-ok"];
  const end = l.validUntil?.toMillis?.() || 0, now = Date.now();
  if (now < end) { const left = Math.ceil((end - now) / DAY); return [left <= 7 ? `${left} din baqi` : "Active", left <= 7 ? "c-warn" : "c-ok"]; }
  if (now < end + GRACE_DAYS * DAY) return ["Mohlat", "c-warn"];
  return ["Khatam", "c-bad"];
}

      <h3 style="margin-top:14px">Haal hi ke SMS</h3><div class="tablewrap"><table><tr><th>Waqt</th><th>Student</th><th>Number</th><th>Qisam</th><th>Status</th></tr>${sm.map(x => `<tr><td>${tm(x.ts)}</td><td>${esc(x.name)}</td><td>${esc(x.to)}</td><td>${esc(x.type)}</td><td>${esc(x.status)}${x.error ? `<br><span class="muted" style="font-size:.78rem">${esc(x.error)}</span>` : ""}</td></tr>`).join("") || `<tr><td class="muted" colspan="5">Koi SMS nahi</td></tr>`}</table></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><h3 style="margin:0">Students (${st.length})</h3><button class="btn sm" id="vCsv">CSV download</button></div>
      <div class="tablewrap"><table><tr><th>ID</th><th>Naam</th><th>Walid</th><th>Class</th><th>Parent phone</th><th>PIN</th></tr>${st.map(x => `<tr><td>${esc(x.id)}</td><td>${esc(x.name)}${x.active === false ? ' <span class="chip c-grey">band</span>' : ""}</td><td>${esc(x.father)}</td><td>${esc(x.cls)}${x.section ? "-" + esc(x.section) : ""}</td><td>${esc(x.phone)}</td><td>${esc(x.pin)}</td></tr>`).join("") || `<tr><td class="muted" colspan="6">Koi student nahi</td></tr>`}</table></div>`;
    m.querySelector("#vX").onclick = closeModal;
    m.querySelector("#vCsv").onclick = () => csvDl(`${sid}-students.csv`, [["id", "name", "father", "class", "section", "phone", "pin", "active"], ...st.map(x => [x.id, x.name, x.father, x.cls, x.section, x.phone, x.pin, x.active !== false ? "yes" : "no"])]);
  } catch (e) { m.innerHTML = `<h3>Data load nahi hua</h3><p class="muted">${esc(e.code || e.message)}</p><button class="btn" id="vX">Band</button>`; m.querySelector("#vX").onclick = closeModal; }
}
/* ---- Reset / Delete ---- */
async function delAll(refs) { for (let i = 0; i < refs.length; i += 400) { const b = writeBatch(db); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); } }
async function wipe(sid, full) {
  const refs = [];
  for (const n of ["students", "attendance", "sms_queue", "daily"]) (await getDocs(collection(db, "schools", sid, n))).docs.forEach(d => refs.push(d.ref));
  (await getDocs(query(collection(db, "portal"), where("schoolId", "==", sid)))).docs.forEach(d => refs.push(d.ref));
  if (full) {
    (await getDocs(query(collection(db, "users"), where("schoolId", "==", sid)))).docs.forEach(d => refs.push(d.ref));
    refs.push(doc(db, "schools", sid), doc(db, "licenses", sid));
  }
  await delAll(refs); return refs.length;
}
function askWipe(l, full) {
  const m = modal(`<h3>${full ? "School account DELETE" : "School ka data RESET"}: ${esc(l.schoolName)}</h3>
    <p class="muted">${full ? "School, us ke admins (Gmail link), license, students, haazri, SMS aur parent portal — <b>sab kuch</b> hamesha ke liye delete. Woh Gmail dobara naya school bana sakegi." : "Students, haazri, SMS aur parent portal delete. School, settings, admins aur license rahenge."} <b>Yeh wapas nahi hoga.</b></p>
    <label class="field"><span>Tasdeeq ke liye School ID <b>${esc(l.id)}</b> likhein</span><input class="input" id="wIn" autocomplete="off"></label>
    <div class="acts" style="justify-content:flex-end"><button class="btn" id="mX">Wapas</button><button class="btn primary" id="mOk" disabled style="background:var(--bad);border-color:var(--bad)">${full ? "Delete karein" : "Reset karein"}</button></div>`);
  const inp = m.querySelector("#wIn"), ok = m.querySelector("#mOk");
  inp.oninput = () => { ok.disabled = inp.value.trim().toUpperCase() !== l.id.toUpperCase(); };
  m.querySelector("#mX").onclick = closeModal;
  ok.onclick = async () => { ok.disabled = true; ok.textContent = "Ho raha hai…"; try { const n = await wipe(l.id, full); closeModal(); toast(`${full ? "Delete" : "Reset"} ho gaya (${n} record)`); } catch (e) { closeModal(); toast("Nahi hua: " + (e.code || e.message)); } };
}
$("#keyTable").onclick = e => {
  const id = e.target.dataset.del; if (!id) return;
  if (confirm(`Key ${id} delete karein?`)) deleteDoc(doc(db, "keys", id)).then(() => toast("Delete ho gayi")).catch(err => toast("Nahi hui: " + err.code));
};
</script>
