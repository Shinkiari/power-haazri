<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Power Haazri — Owner Panel (PRIVATE)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B2A4A;--ink2:#2C3E66;--gold:#E8A33D;--gold2:#F6D9A6;--paper:#F3F5FA;--line:#DCE2EE;--text:#1E2940;--muted:#66728A;--ok:#2F8F5B;--okbg:#E4F3EA;--late:#B57A0E;--latebg:#FBF0D9;--bad:#C2453D;--badbg:#F8E4E2;font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2}
header{background:var(--ink);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 22px 16px;display:flex;align-items:center;gap:12px}
header svg{width:36px;height:36px;flex:none}
header b{display:block}header small{opacity:.7;font-size:.8rem}
header button{margin-left:auto}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.card h3{font-size:1rem;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stats b{display:block;font-size:1.5rem;font-weight:600}
.stats span{font-size:.8rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:.82rem}
.input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}
.field{display:block;margin-bottom:12px}.field>span{display:block;font-size:.82rem;color:var(--muted);margin-bottom:3px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 12px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.keybox{background:var(--paper);border:1px dashed var(--ink2);border-radius:10px;padding:14px;margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.keybox code{font-size:1.35rem;font-weight:600;letter-spacing:.08em;flex:1}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-weight:500;color:var(--muted);padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px;border-bottom:1px solid #EEF1F7;vertical-align:top}
tr:last-child td{border:0}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.76rem;font-weight:500;white-space:nowrap}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--latebg);color:var(--late)}.c-bad{background:var(--badbg);color:var(--bad)}.c-grey{background:#EDF0F6;color:var(--muted)}
.acts{display:flex;gap:5px;flex-wrap:wrap}
.muted{color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;background:var(--ink);padding:20px}
.login .card{max-width:360px;width:100%;text-align:center;padding:30px 24px}
.err{background:var(--badbg);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:.86rem;margin-top:12px}
.modal{position:fixed;inset:0;background:rgba(18,26,46,.55);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:#fff;border-radius:12px;max-width:460px;width:100%;padding:20px 22px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
@media (max-width:760px){.stats,.g4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo" viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#E8A33D"/><path d="M24 7l4.6 11.2L40.5 19l-9.1 7.7 2.9 11.8L24 32.1l-10.3 6.4 2.9-11.8L7.5 19l11.9-.8z" fill="#1B2A4A"/></symbol></svg>

<div id="login" class="login"><div class="card">
  <svg style="width:56px;height:56px"><use href="#logo"/></svg>
  <h2 style="margin:12px 0 4px">Power Haazri — Owner</h2>
  <p class="muted" style="margin:0 0 18px">Sirf Power Technology ke liye</p>
  <button class="btn primary" id="gBtn" style="width:100%">Google se login</button>
  <div class="err" id="lErr" hidden></div>
</div></div>

<div id="app" hidden>
  <header><svg><use href="#logo"/></svg><div><b>Power Haazri — Owner panel</b><small id="who"></small></div><button class="btn sm" id="out">Logout</button></header>
  <main>
    <div class="stats" id="stats"></div>

    <div class="card">
      <h3>Activation key banayein</h3>
      <div class="seg" id="seg">
        <button data-t="trial" data-d="7" class="on">Trial</button>
        <button data-t="period" data-d="30">Muqarrar muddat</button>
        <button data-t="year" data-d="365">1 saal</button>
        <button data-t="life" data-d="0">Lifetime</button>
      </div>
      <div class="g4">
        <label class="field" id="daysF"><span>Din</span><input class="input" id="kDays" type="number" min="1" value="7"></label>
        <label class="field"><span>School / client ka naam</span><input class="input" id="kNote"></label>
        <label class="field"><span>Client WhatsApp number</span><input class="input" id="kPhone" placeholder="03xx-xxxxxxx"></label>
        <label class="field"><span>Raqam (Rs)</span><input class="input" id="kAmt" type="number" min="0" value="0"></label>
      </div>
      <button class="btn gold" id="kGen">Key banayein</button>
      <div id="kOut"></div>
    </div>

    <div class="card">
      <h3>Schools</h3>
      <div class="tablewrap"><table id="schTable"></table></div>
    </div>

    <div class="card">
      <h3>Keys</h3>
      <div class="tablewrap"><table id="keyTable"></table></div>
    </div>
  </main>
</div>
<div id="modal" class="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, collection, query, where, orderBy, limit, onSnapshot, writeBatch, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = await (await fetch("./config.json", { cache: "no-store" })).json(); // config.json (isi folder mein)
const OWNER_EMAIL = "shinkiari45@gmail.com";
const APP_URL = "https://shinkiari.github.io/power-haazri/"; // client ko diya jane wala app link
const GRACE_DAYS = 3;

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = ms => new Date(ms).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const DAY = 864e5;
const TYPE = { trial: "Trial", period: "Muddat", year: "1 saal", life: "Lifetime" };
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2800); }
function normWa(p) { let d = String(p || "").replace(/\D/g, ""); if (d.startsWith("0")) d = "92" + d.slice(1); return d; }
function genKey() { const c = "23456789ABCDEFGHJKMNPQRSTUVWXYZ"; const r = [...crypto.getRandomValues(new Uint8Array(12))].map(x => c[x % c.length]).join(""); return r.match(/.{4}/g).join("-"); }
function modal(html) { $("#mbox").style.cssText = ""; $("#mbox").innerHTML = html; $("#modal").hidden = false; return $("#mbox"); }
const closeModal = () => { $("#modal").hidden = true; };
$("#modal").onclick = e => { if (e.target.id === "modal") closeModal(); };

let schools = [], keys = [], unsubs = [], curType = "trial";

$("#gBtn").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => { $("#lErr").textContent = "Login nahi hua: " + (e.code || e.message); $("#lErr").hidden = false; });
$("#out").onclick = () => signOut(auth);
onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = [];
  if (!user) { $("#login").hidden = false; $("#app").hidden = true; return; }
  if (user.email !== OWNER_EMAIL) { $("#lErr").textContent = `Yeh panel sirf ${OWNER_EMAIL} ke liye hai.`; $("#lErr").hidden = false; signOut(auth); return; }
  $("#who").textContent = user.email; $("#login").hidden = true; $("#app").hidden = false;
  unsubs.push(onSnapshot(collection(db, "licenses"), s => { schools = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, e => toast("Schools load nahi hue: " + e.code)));
  unsubs.push(onSnapshot(query(collection(db, "keys"), orderBy("createdAt", "desc"), limit(200)), s => { keys = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }));
});

/* Key generator */
$("#seg").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  [...$("#seg").children].forEach(x => x.classList.toggle("on", x === b));
  curType = b.dataset.t; $("#kDays").value = b.dataset.d;
  $("#daysF").style.visibility = curType === "life" ? "hidden" : "visible";
  $("#kDays").readOnly = curType === "year";
};
$("#kGen").onclick = async () => {
  const days = curType === "life" ? 0 : Math.max(1, Number($("#kDays").value) || 0);
  const key = genKey(), note = $("#kNote").value.trim(), phone = $("#kPhone").value.trim(), amount = Number($("#kAmt").value) || 0;
  try {
    await setDoc(doc(db, "keys", key), { type: curType, days, note, phone, amount, used: false, createdAt: Date.now() });
    const what = curType === "life" ? "Lifetime" : `${days} din`;
    const msg = `Assalam o Alaikum${note ? " " + note : ""}!\nPower Haazri activation key (${what}):\n${key}\n\nApp: ${APP_URL}\nGmail se login karke key darj karein.\n- Power Technology Shinkiari\n0310-5802297, 0333-9764399`;
    $("#kOut").innerHTML = `<div class="keybox"><code>${key}</code><span class="muted">${what}</span><button class="btn sm" id="kCopy">Copy</button>${phone ? `<a class="btn sm gold" target="_blank" rel="noopener" href="https://wa.me/${normWa(phone)}?text=${encodeURIComponent(msg)}">WhatsApp client ko</a>` : ""}</div>`;
    $("#kCopy").onclick = () => navigator.clipboard.writeText(msg).then(() => toast("Key aur message copy ho gaye"));
  } catch (e) { toast("Key nahi bani: " + (e.code || e.message)); }
};

/* Status helper */
function status(l) {
  if (l.locked) return ["Band", "c-bad"];
  if (l.life) return ["Lifetime", "c-ok"];
  const end = l.validUntil?.toMillis?.() || 0, now = Date.now();
  if (now < end) { const left = Math.ceil((end - now) / DAY); return [left <= 7 ? `${left} din baqi` : "Active", left <= 7 ? "c-warn" : "c-ok"]; }
  if (now < end + GRACE_DAYS * DAY) return ["Mohlat", "c-warn"];
  return ["Khatam", "c-bad"];
}

function render() {
  const active = schools.filter(l => ["c-ok", "c-warn"].includes(status(l)[1])).length;
  const earned = keys.filter(k => k.used).reduce((a, k) => a + (Number(k.amount) || 0), 0);
  $("#stats").innerHTML = `<div><b>${schools.length}</b><span>Kul schools</span></div><div><b>${active}</b><span>Chalu</span></div><div><b>${keys.filter(k => !k.used).length}</b><span>Na-istemal keys</span></div><div><b>Rs ${earned.toLocaleString()}</b><span>Kul kamai (istemal shuda keys)</span></div>`;

  const sorted = [...schools].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  $("#schTable").innerHTML = sorted.length ? `<tr><th>School</th><th>Rabta</th><th>License</th><th>Status</th><th>Amal</th></tr>` + sorted.map(l => {
    const [st, cls] = status(l);
    return `<tr><td><b>${esc(l.schoolName)}</b><br><span class="muted">ID: ${esc(l.id)}</span></td>
      <td>${esc(l.ownerEmail)}<br><span class="muted">${esc(l.phone)}</span></td>
      <td>${TYPE[l.type] || "—"}<br><span class="muted">${l.life ? "Hamesha" : l.validUntil ? fmt(l.validUntil.toMillis()) + " tak" : "—"}</span>${l.message ? `<br><span class="muted" style="font-size:.78rem">Msg: ${esc(l.message)}</span>` : ""}</td>
      <td><span class="chip ${cls}">${st}</span></td>
      <td><div class="acts">
        ${l.locked ? `<button class="btn sm" data-a="unlock" data-id="${l.id}">Unlock</button>` : `<button class="btn sm danger" data-a="lock" data-id="${l.id}">Lock</button>`}
        <button class="btn sm" data-a="m1" data-id="${l.id}">+1 mahina</button>
        <button class="btn sm" data-a="y1" data-id="${l.id}">+1 saal</button>
        <button class="btn sm" data-a="date" data-id="${l.id}">Tareekh</button>
        ${l.life ? "" : `<button class="btn sm" data-a="life" data-id="${l.id}">Lifetime</button>`}
        <button class="btn sm" data-a="msg" data-id="${l.id}">Message</button>
        <button class="btn sm gold" data-a="view" data-id="${l.id}">Data dekhein</button>
        <button class="btn sm danger" data-a="reset" data-id="${l.id}">Reset</button>
        <button class="btn sm danger" data-a="del" data-id="${l.id}">Delete</button>
      </div></td></tr>`;
  }).join("") : `<tr><td class="muted">Abhi koi school register nahi hua.</td></tr>`;

  const nameOf = sid => schools.find(s => s.id === sid)?.schoolName || sid;
  $("#keyTable").innerHTML = keys.length ? `<tr><th>Key</th><th>Qisam</th><th>Client</th><th>Raqam</th><th>Status</th><th></th></tr>` + keys.map(k => `<tr>
    <td><code>${k.id}</code><br><span class="muted">${fmt(k.createdAt)}</span></td>
    <td>${TYPE[k.type]}${k.type !== "life" ? ` (${k.days} din)` : ""}</td>
    <td>${esc(k.note)}<br><span class="muted">${esc(k.phone)}</span></td>
    <td>${k.amount ? "Rs " + Number(k.amount).toLocaleString() : "—"}</td>
    <td>${k.used ? `<span class="chip c-ok">Istemal: ${esc(nameOf(k.schoolId))}</span>` : `<span class="chip c-grey">Na-istemal</span>`}</td>
    <td>${k.used ? "" : `<button class="btn sm danger" data-del="${k.id}">Delete</button>`}</td></tr>`).join("") : `<tr><td class="muted">Abhi koi key nahi bani.</td></tr>`;
}

/* School actions */
$("#schTable").onclick = e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const l = schools.find(s => s.id === b.dataset.id), ref = doc(db, "licenses", l.id);
  const base = Math.max(Date.now(), l.validUntil?.toMillis?.() || 0);
  const save = (data, okMsg) => updateDoc(ref, data).then(() => toast(okMsg)).catch(err => toast("Nahi hua: " + err.code));
  const a = b.dataset.a;
  if (a === "lock") {
    const m = modal(`<h3>${esc(l.schoolName)} lock karein?</h3><p class="muted">School ka data mehfooz rahega, sirf dekh sakenge. Scan aur SMS band ho jayenge.</p>
      <label class="field"><span>School ko dikhne wala message</span><textarea class="input" id="mMsg" rows="3">Fees pending hai. Barah-e-karam Power Technology se rabta karein: 0310-5802297</textarea></label>
      <div class="acts" style="justify-content:flex-end"><button class="btn" id="mX">Wapas</button><button class="btn primary" id="mOk">Lock karein</button></div>`);
    m.querySelector("#mX").onclick = closeModal;
    m.querySelector("#mOk").onclick = () => { save({ locked: true, message: m.querySelector("#mMsg").value.trim() }, "School lock ho gaya"); closeModal(); };
  }
  if (a === "view") viewSchool(l);
  if (a === "reset") askWipe(l, false);
  if (a === "del") askWipe(l, true);
  if (a === "unlock") save({ locked: false, message: "" }, "School unlock ho gaya");
  if (a === "m1") save({ validUntil: Timestamp.fromMillis(base + 30 * DAY), type: l.life ? "life" : "period" }, "1 mahina barh gaya");
  if (a === "y1") save({ validUntil: Timestamp.fromMillis(base + 365 * DAY), type: l.life ? "life" : "year" }, "1 saal barh gaya");
  if (a === "life") save({ life: true, type: "life", validUntil: Timestamp.fromMillis(Date.UTC(2099, 11, 31)) }, "Lifetime ho gaya");
  if (a === "date") {
    const cur = l.validUntil ? new Date(l.validUntil.toMillis()).toISOString().slice(0, 10) : "";
    const m = modal(`<h3>Muddat ki tareekh</h3><label class="field"><span>Kis tareekh tak chalega</span><input class="input" type="date" id="mD" value="${cur}"></label>
      <p class="muted" style="font-size:.85rem">Lifetime hata kar muqarrar tareekh lagani ho to yahan se karein.</p>
      <div class="acts" style="justify-content:flex-end"><button class="btn" id="mX">Wapas</button><button class="btn primary" id="mOk">Save</button></div>`);
    m.querySelector("#mX").onclick = closeModal;
    m.querySelector("#mOk").onclick = () => { const v = m.querySelector("#mD").value; if (!v) return; const [y, mo, d] = v.split("-").map(Number); save({ validUntil: Timestamp.fromMillis(new Date(y, mo - 1, d, 23, 59).getTime()), life: false, type: l.type === "life" ? "period" : l.type }, "Tareekh save ho gayi"); closeModal(); };
  }
  if (a === "msg") {
    const m = modal(`<h3>School ke liye message</h3><p class="muted" style="font-size:.85rem">School ke dashboard par upar patti mein nazar aayega (lock kiye baghair bhi). Khali chhorne se hat jayega.</p>
      <textarea class="input" id="mMsg" rows="3">${esc(l.message || "")}</textarea>
      <div class="acts" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="mX">Wapas</button><button class="btn primary" id="mOk">Save</button></div>`);
    m.querySelector("#mX").onclick = closeModal;
    m.querySelector("#mOk").onclick = () => { save({ message: m.querySelector("#mMsg").value.trim() }, "Message save ho gaya"); closeModal(); };
  }
};
/* ---- School ka data dekhna ---- */
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const tm = ms => ms ? new Date(ms).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";
function csvDl(name, rows) { const t = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n"); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + t], { type: "text/csv" })); a.download = name; a.click(); }
async function viewSchool(l) {
  const m = modal(`<h3>${esc(l.schoolName)}</h3><p class="muted">Data load ho raha hai…</p>`);
  m.style.maxWidth = "960px"; m.style.maxHeight = "90vh"; m.style.overflow = "auto";
  try {
    const sid = l.id, sub = n => collection(db, "schools", sid, n);
    const [sc, users, studs, att, sms] = await Promise.all([
      getDoc(doc(db, "schools", sid)), getDocs(query(collection(db, "users"), where("schoolId", "==", sid))),
      getDocs(sub("students")), getDocs(query(sub("attendance"), where("date", "==", today()))),
      getDocs(query(sub("sms_queue"), orderBy("ts", "desc"), limit(40)))]);
    const S2 = sc.data() || {}, st = studs.docs.map(d => d.data()).sort((a, b) => String(a.cls).localeCompare(String(b.cls), undefined, { numeric: true }) || String(a.name).localeCompare(String(b.name)));
    const at = att.docs.map(d => d.data()), sm = sms.docs.map(d => d.data());
    const cnt = k => sm.filter(x => x.status === k).length;
    const present = at.filter(x => x.in).length, late = at.filter(x => x.status === "late").length;
    m.innerHTML = `<div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">${S2.logo ? `<img src="${S2.logo}" style="width:48px;height:48px;object-fit:contain;border-radius:8px;border:1px solid var(--line)">` : ""}<div style="flex:1"><h3 style="margin:0">${esc(S2.schoolName || l.schoolName)}</h3><span class="muted">ID ${esc(sid)} · ${esc(S2.phone || "")} · ${esc(S2.address || "")}</span></div><button class="btn sm" id="vX">Band</button></div>
      <div class="stats" style="margin-bottom:14px"><div><b>${st.length}</b><span>Students</span></div><div><b>${present}</b><span>Aaj aaye</span></div><div><b>${late}</b><span>Aaj late</span></div><div><b>${cnt("sent")} / ${cnt("pending") + cnt("sending")} / ${cnt("failed")}</b><span>SMS: gaye / queue / fail (aakhri 40)</span></div></div>
      <h3>Admins</h3><div class="tablewrap"><table>${users.docs.map(d => { const u = d.data(); return `<tr><td>${esc(u.email)}</td><td>${u.role === "main" ? "Main admin" : "Admin"}</td><td class="muted">${tm(u.joinedAt)}</td></tr>`; }).join("") || `<tr><td class="muted">Koi nahi</td></tr>`}</table></div>
      <h3 style="margin-top:14px">Aaj ki haazri (${today()})</h3><div class="tablewrap"><table><tr><th>ID</th><th>Naam</th><th>Class</th><th>Aamad</th><th>Rawangi</th><th>Status</th></tr>${at.sort((a, b) => String(a.in || "").localeCompare(String(b.in || ""))).map(x => `<tr><td>${esc(x.sid)}</td><td>${esc(x.name)}</td><td>${esc(x.cls)}</td><td>${esc(x.in || "")}</td><td>${esc(x.out || "")}</td><td>${esc(x.status || "")}</td></tr>`).join("") || `<tr><td class="muted" colspan="6">Aaj abhi koi scan nahi</td></tr>`}</table></div>
      <h3 style="margin-top:14px">Haal hi ke SMS</h3><div class="tablewrap"><table><tr><th>Waqt</th><th>Student</th><th>Number</th><th>Qisam</th><th>Status</th></tr>${sm.map(x => `<tr><td>${tm(x.ts)}</td><td>${esc(x.name)}</td><td>${esc(x.to)}</td><td>${esc(x.type)}</td><td>${esc(x.status)}${x.error ? `<br><span class="muted" style="font-size:.78rem">${esc(x.error)}</span>` : ""}</td></tr>`).join("") || `<tr><td class="muted" colspan="5">Koi SMS nahi</td></tr>`}</table></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px"><h3 style="margin:0">Students (${st.length})</h3><button class="btn sm" id="vCsv">CSV download</button></div>
      <div class="tablewrap"><table><tr><th>ID</th><th>Naam</th><th>Walid</th><th>Class</th><th>Parent phone</th><th>PIN</th></tr>${st.map(x => `<tr><td>${esc(x.id)}</td><td>${esc(x.name)}${x.active === false ? ' <span class="chip c-grey">band</span>' : ""}</td><td>${esc(x.father)}</td><td>${esc(x.cls)}${x.section ? "-" + esc(x.section) : ""}</td><td>${esc(x.phone)}</td><td>${esc(x.pin)}</td></tr>`).join("") || `<tr><td class="muted" colspan="6">Koi student nahi</td></tr>`}</table></div>`;
    m.querySelector("#vX").onclick = closeModal;
    m.querySelector("#vCsv").onclick = () => csvDl(`${sid}-students.csv`, [["id", "name", "father", "class", "section", "phone", "pin", "active"], ...st.map(x => [x.id, x.name, x.father, x.cls, x.section, x.phone, x.pin, x.active !== false ? "yes" : "no"])]);
  } catch (e) { m.innerHTML = `<h3>Data load nahi hua</h3><p class="muted">${esc(e.code || e.message)}</p><button class="btn" id="vX">Band</button>`; m.querySelector("#vX").onclick = closeModal; }
}
/* ---- Reset / Delete ---- */
async function delAll(refs) { for (let i = 0; i < refs.length; i += 400) { const b = writeBatch(db); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); } }
async function wipe(sid, full) {
  const refs = [];
  for (const n of ["students", "attendance", "sms_queue", "daily"]) (await getDocs(collection(db, "schools", sid, n))).docs.forEach(d => refs.push(d.ref));
  (await getDocs(query(collection(db, "portal"), where("schoolId", "==", sid)))).docs.forEach(d => refs.push(d.ref));
  if (full) {
    (await getDocs(query(collection(db, "users"), where("schoolId", "==", sid)))).docs.forEach(d => refs.push(d.ref));
    refs.push(doc(db, "schools", sid), doc(db, "licenses", sid));
  }
  await delAll(refs); return refs.length;
}
function askWipe(l, full) {
  const m = modal(`<h3>${full ? "School account DELETE" : "School ka data RESET"}: ${esc(l.schoolName)}</h3>
    <p class="muted">${full ? "School, us ke admins (Gmail link), license, students, haazri, SMS aur parent portal — <b>sab kuch</b> hamesha ke liye delete. Woh Gmail dobara naya school bana sakegi." : "Students, haazri, SMS aur parent portal delete. School, settings, admins aur license rahenge."} <b>Yeh wapas nahi hoga.</b></p>
    <label class="field"><span>Tasdeeq ke liye School ID <b>${esc(l.id)}</b> likhein</span><input class="input" id="wIn" autocomplete="off"></label>
    <div class="acts" style="justify-content:flex-end"><button class="btn" id="mX">Wapas</button><button class="btn primary" id="mOk" disabled style="background:var(--bad);border-color:var(--bad)">${full ? "Delete karein" : "Reset karein"}</button></div>`);
  const inp = m.querySelector("#wIn"), ok = m.querySelector("#mOk");
  inp.oninput = () => { ok.disabled = inp.value.trim().toUpperCase() !== l.id.toUpperCase(); };
  m.querySelector("#mX").onclick = closeModal;
  ok.onclick = async () => { ok.disabled = true; ok.textContent = "Ho raha hai…"; try { const n = await wipe(l.id, full); closeModal(); toast(`${full ? "Delete" : "Reset"} ho gaya (${n} record)`); } catch (e) { closeModal(); toast("Nahi hua: " + (e.code || e.message)); } };
}
$("#keyTable").onclick = e => {
  const id = e.target.dataset.del; if (!id) return;
  if (confirm(`Key ${id} delete karein?`)) deleteDoc(doc(db, "keys", id)).then(() => toast("Delete ho gayi")).catch(err => toast("Nahi hui: " + err.code));
};
</script>
