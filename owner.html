<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16233F">
<meta name="robots" content="noindex">
<title>Power Haazri — Owner Panel (PRIVATE)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16233F;--ink2:#24365E;--gold:#E8A33D;--gold2:#F6D9A6;--goldbg:#FDF4E3;
  --paper:#F3F5F9;--card:#fff;--line:#E3E8F1;--line2:#EEF1F6;--text:#18233B;--muted:#68748B;
  --ok:#1F8556;--okbg:#E3F4EB;--warn:#A86E06;--warnbg:#FCF1DA;--bad:#C2453D;--badbg:#FBE7E5;--blue:#2F6FDB;--bluebg:#E7EFFD;--violet:#7A45C2;--violetbg:#F1E8FB;
  --r:16px;--nav:64px;--side:248px;
  font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--text);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}
.brandlogo{display:block;flex:none}.brandlogo svg,.brandlogo img{width:100%;height:100%;display:block}.brandlogo img{object-fit:contain;border-radius:24%;background:#fff}

/* ---------- Login ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 18px;background:radial-gradient(900px 420px at 85% -10%,rgba(232,163,61,.28),transparent 60%),linear-gradient(160deg,#1F3263,#0E172C)}
.lcard{background:#fff;border-radius:22px;max-width:380px;width:100%;padding:34px 26px 26px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.lcard .brandlogo{width:82px;height:82px;margin:0 auto 16px}
.lcard h1{font-size:1.35rem}
.lcard p{margin:6px 0 24px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:12px;border:0;background:var(--ink);color:#fff;font-weight:500;font-size:1rem}
.gbtn:active{transform:scale(.99)}
.lfoot{font-size:.78rem;color:var(--muted);margin-top:18px}
.err{background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:.86rem;margin-top:14px;text-align:left}

/* ---------- Shell ---------- */
.shell{min-height:100vh;min-height:100dvh}
.side{display:none}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(10,18,36,.18)}
.top .brandlogo{width:36px;height:36px}
.top .tt{flex:1;min-width:0}
.top .tt b{display:block;font-size:1.02rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt span{display:block;font-size:.74rem;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;flex:none}
.ibtn:active{background:rgba(255,255,255,.2)}
.page{padding:16px 16px calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px));max-width:1080px;margin:0 auto}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(22,35,63,.06)}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:.72rem;font-weight:500}
.bnav button .pill{width:52px;height:30px;border-radius:16px;display:grid;place-items:center;transition:background .15s}
.bnav button.on{color:var(--ink)}
.bnav button.on .pill{background:var(--goldbg);color:#9A5F00}

/* ---------- Common blocks ---------- */
.hello{margin:2px 2px 16px}
.hello h2{font-size:1.3rem;font-weight:500}.hello h2 b{font-weight:600}
.hello p{margin:2px 0 0;font-size:.86rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.stat i{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-style:normal}
.stat b{display:block;font-size:1.4rem;font-weight:600;line-height:1.1;margin-bottom:2px}
.stat span{font-size:.78rem;color:var(--muted)}
.t-blue{background:var(--bluebg);color:var(--blue)}.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-vio{background:var(--violetbg);color:var(--violet)}.t-bad{background:var(--badbg);color:var(--bad)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec h3{font-size:.98rem}
.sec a,.link{color:var(--blue);font-size:.85rem;font-weight:500;background:none;border:0;padding:0;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line2);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:last-child{border-bottom:0}
button.row:active,button.row:hover{background:#F8FAFD}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .grow span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .end small{font-size:.74rem;color:var(--muted)}
.av{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:600;color:#fff;font-size:.92rem;background:linear-gradient(135deg,#34508A,#16233F)}
.chev{color:#B3BCCD}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:.74rem;font-weight:500;white-space:nowrap}
.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-bad{background:var(--badbg);color:var(--bad)}.c-grey{background:#EDF0F6;color:var(--muted)}

/* buttons & inputs */
.btn{border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#F8FAFD;border-color:#CBD3E2}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.primary:hover{background:var(--ink2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1A2540;font-weight:600}.btn.gold:hover{background:#F0B04F}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}.btn.wa:hover{background:#1A9549}
.btn.danger{color:var(--bad);border-color:#F1CFCB}.btn.danger:hover{background:var(--badbg)}
.btn.dfill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:6px 12px;font-size:.82rem;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:.95rem}
.input:focus{border-color:#9FB0D3;outline:none;box-shadow:0 0 0 3px rgba(47,111,219,.12)}
textarea.input{resize:vertical}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.searchbox{position:relative;margin-bottom:12px}
.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox .input{padding-left:42px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-size:.84rem;font-weight:500;color:var(--muted)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips button em{font-style:normal;opacity:.7;margin-left:4px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#E9EDF4;border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:500;font-size:.84rem;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(22,35,63,.12)}
.keybox{background:linear-gradient(135deg,#FFF8EA,#FDF0D5);border:1px dashed var(--gold);border-radius:14px;padding:16px;text-align:center}
.keybox code{display:block;font-size:1.5rem;font-weight:600;letter-spacing:.08em;color:var(--ink);margin:4px 0 2px;word-break:break-all}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow>.btn{flex:1 1 0}

/* ---------- School detail ---------- */
.detail{position:fixed;inset:0;z-index:40;background:var(--paper);overflow-y:auto;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.dhead{background:linear-gradient(160deg,#1F3263,#121C33);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 22px}
.dhead>*{max-width:728px;margin-left:auto;margin-right:auto}
.dhead .bar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.dhead .bar b{flex:1;font-weight:500;font-size:.95rem;opacity:.85}
.dprof{display:flex;align-items:center;gap:14px}
.dprof .av{width:56px;height:56px;border-radius:16px;font-size:1.15rem;background:rgba(255,255,255,.14)}
.dprof .av img{width:100%;height:100%;object-fit:contain;border-radius:16px;background:#fff}
.dprof h2{font-size:1.2rem}
.dprof p{margin:3px 0 0;font-size:.82rem;opacity:.75}
.dbody{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:-6px}
.info>div{background:#fff;padding:12px 14px;min-width:0}
.info span{display:block;font-size:.74rem;color:var(--muted)}
.info b{display:block;font-weight:500;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info .wide{grid-column:1/-1}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warnbg);color:#7A5205;border-radius:12px;padding:11px 13px;font-size:.85rem;margin-top:12px}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.8rem;font-weight:500;text-align:center;line-height:1.25}
.act:hover{border-color:#CBD3E2;background:#FBFCFE}
.act:active{transform:scale(.98)}
.act i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-style:normal}
.act.bad{color:var(--bad)}
.lockbar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lockbar .grow{flex:1}
.lockbar b{display:block;font-weight:600}
.lockbar span{font-size:.8rem;color:var(--muted)}

/* ---------- Sheet / modal ---------- */
.modal{position:fixed;inset:0;background:rgba(12,20,40,.55);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.mbox{background:#fff;width:100%;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease}
.mbox:before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:#D5DBE6;margin:0 auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.mbox h3{font-size:1.08rem;margin-bottom:6px}
.mbox .sub{font-size:.86rem;color:var(--muted);margin:0 0 14px}
.mfoot{display:flex;gap:10px;margin-top:16px}
.mfoot>.btn{flex:1}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font-weight:500;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;background:#FAFBFD}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.minis div{background:var(--paper);border-radius:12px;padding:10px;text-align:center}
.minis b{display:block;font-size:1.15rem}
.minis span{font-size:.7rem;color:var(--muted)}
.lgprev{width:84px;height:84px;border-radius:18px;border:1px solid var(--line);padding:6px;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:.9rem;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.menu{position:fixed;z-index:70;top:calc(58px + env(safe-area-inset-top,0px));right:12px;background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(12,20,40,.22);min-width:220px;padding:6px;border:1px solid var(--line)}
.menu .me{padding:10px 12px 8px;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--line2);margin-bottom:4px;word-break:break-all}
.menu button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:none;padding:11px 12px;border-radius:10px;text-align:left;font-weight:500}
.menu button:hover{background:var(--paper)}
.menu .bad{color:var(--bad)}

/* ---------- Desktop ---------- */
@media (min-width:900px){
  .bnav{display:none}
  .side{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:var(--side);background:var(--ink);color:#fff;padding:22px 14px;z-index:25}
  .side .sb{display:flex;align-items:center;gap:12px;padding:0 8px 22px}
  .side .sb .brandlogo{width:44px;height:44px}
  .side .sb b{display:block;font-size:1.02rem}.side .sb span{font-size:.74rem;opacity:.65}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{border:0;background:none;color:rgba(255,255,255,.72);display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-weight:500;text-align:left}
  .side nav button:hover{background:rgba(255,255,255,.07);color:#fff}
  .side nav button.on{background:rgba(232,163,61,.16);color:var(--gold2)}
  .side .sfoot{margin-top:auto;font-size:.74rem;opacity:.55;padding:0 8px;line-height:1.6}
  .main{margin-left:var(--side)}
  .top{background:var(--paper);color:var(--text);box-shadow:none;padding:22px 28px 6px;position:static}
  .top .brandlogo{display:none}
  .top .tt b{font-size:1.4rem}
  .top .tt span{display:none}
  .top .ibtn{background:#fff;color:var(--text);border:1px solid var(--line)}
  .page{padding:12px 28px 40px;max-width:1120px;margin:0}
  .stats{grid-template-columns:repeat(4,1fr)}
  .stat{flex-direction:row;align-items:center;padding:16px 18px}
  .hgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:0 20px}
  .slist{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:none;border:0;overflow:visible}
  .slist .row{background:#fff;border:1px solid var(--line);border-radius:var(--r)}
  .nk{max-width:620px}
  .detail{left:var(--side)}
  .modal{align-items:center;padding:20px}
  .mbox{max-width:500px;border-radius:20px;padding:22px 24px}
  .mbox.wide{max-width:960px}
  .mbox:before{display:none}
  .toast{bottom:28px}
  .menu{top:70px;right:28px}
  .agrid{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:380px){.agrid{grid-template-columns:repeat(2,1fr)}.seg button{font-size:.76rem}.minis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ptg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34508A"/><stop offset="1" stop-color="#121C33"/></linearGradient>
    <linearGradient id="ptb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE29A"/><stop offset="1" stop-color="#E8A33D"/></linearGradient>
  </defs>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-school" viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-5h6v5M10 11h4"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9.2-9.2M17 6l3 3M14 9l2 2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>

  <symbol id="i-rs" viewBox="0 0 24 24"><path d="M6 4h12M6 9h12M6 4h3a5 5 0 0 1 0 10H6l8 6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
  <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-inf" viewBox="0 0 24 24"><path d="M7 15.5a3.5 3.5 0 1 1 0-7c3 0 7 7 10 7a3.5 3.5 0 1 0 0-7c-3 0-7 7-10 7z"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2800); }
function normWa(p) { let d = String(p || "").replace(/\D/g, ""); if (d.startsWith("0")) d = "92" + d.slice(1); return d; }
function genKey() { const c = "23456789ABCDEFGHJKMNPQRSTUVWXYZ"; const r = [...crypto.getRandomValues(new Uint8Array(12))].map(x => c[x % c.length]).join(""); return r.match(/.{4}/g).join("-"); }
function genCode(n) { const c = "23456789ABCDEFGHJKMNPQRSTUVWXYZ"; return [...crypto.getRandomValues(new Uint8Array(n))].map(x => c[x % c.length]).join(""); }
const initials = n => String(n || "S").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();

/* ---------- Native helpers (APK + browser dono) ---------- */

    toast(okMsg);

}
function csvDl(name, rows) {
  const t = "﻿" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  if (AND && AND.saveFile) { AND.saveFile(name, t); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t], { type: "text/csv" })); a.download = name; a.click();
}

/* ---------- Modal / sheet ---------- */
function modal(html, wide = false) { const b = $("#mbox"); b.className = "mbox" + (wide ? " wide" : ""); b.innerHTML = html; $("#modal").hidden = false; b.scrollTop = 0; return b; }

let schools = [], keys = [], unsubs = [], curType = "trial", sFilter = "all", kFilter = "all", view = "home", openSid = null;

document.addEventListener("click", e => { if (!e.target.closest("#menu")) $("#menu").hidden = true; });
// Android back button
window.__back = () => {
  if (!$("#menu").hidden) { $("#menu").hidden = true; return true; }
  if (!$("#modal").hidden) { closeModal(); return true; }
  if (openSid) { closeDetail(); return true; }
  if (view !== "home") { show("home"); return true; }

};

/* ---------- Brand ---------- */
const DEFAULT_LOGO = document.querySelector("[data-blogo]").innerHTML;
let brand = (() => { try { return JSON.parse(localStorage.getItem("pt_brand") || "{}"); } catch (e) { return {}; } })();
function paintBrand() {
  document.querySelectorAll("[data-blogo]").forEach(el => { el.innerHTML = brand.logo ? `<img src="${brand.logo}" alt="">` : DEFAULT_LOGO; });
  document.querySelectorAll("[data-bname]").forEach(el => { el.textContent = brand.name || "Power Technology"; });
  try { localStorage.setItem("pt_brand", JSON.stringify(brand)); } catch (e) {}
}
paintBrand();
async function shrinkImg(file) {
  if (!file || !/^image\//.test(file.type)) throw new Error("Sirf tasveer chunein");
  const url = await new Promise((r, j) => { const f = new FileReader(); f.onload = () => r(f.result); f.onerror = j; f.readAsDataURL(file); });
  const img = await new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => j(new Error("Tasveer nahi khuli")); i.src = url; });
  const sc = Math.min(1, 256 / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c.toDataURL("image/png");
}
$("#brandBtn").onclick = () => {
  $("#menu").hidden = true;
  let lg = brand.logo || "";
  const m = modal(`<h3>Brand — logo aur naam</h3><p class="sub">Yeh owner panel aur login screen par nazar aata hai.</p>
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px"><span class="brandlogo lgprev" id="bPrev"></span>
      <div style="display:flex;flex-direction:column;gap:8px;flex:1"><input type="file" accept="image/*" id="bFile" hidden><button class="btn sm" id="bPick">Naya logo chunein</button><button class="btn sm" id="bDef">Default logo</button></div></div>
    <label class="field"><span>Naam</span><input class="input" id="bName" value="${esc(brand.name || "Power Technology")}"></label>
    <div class="mfoot"><button class="btn" id="mX">Wapas</button><button class="btn primary" id="mOk">Save</button></div>`);
  const pv = () => { m.querySelector("#bPrev").innerHTML = lg ? `<img src="${lg}" alt="">` : DEFAULT_LOGO; }; pv();
  m.querySelector("#bPick").onclick = () => m.querySelector("#bFile").click();
  m.querySelector("#bFile").onchange = async e => { try { lg = await shrinkImg(e.target.files[0]); pv(); } catch (err) { toast(err.message); } };
  m.querySelector("#bDef").onclick = () => { lg = ""; pv(); };
  m.querySelector("#mX").onclick = closeModal;
  m.querySelector("#mOk").onclick = async () => {
    brand = { logo: lg, name: m.querySelector("#bName").value.trim() || "Power Technology" }; paintBrand(); closeModal();
    try { await setDoc(doc(db, "meta", "brand"), brand); toast("Brand save ho gaya"); } catch (err) { toast("Save nahi hua: " + (err.code || err.message)); }
  };
};

/* ---------- Auth ---------- */
function lErr(m) { $("#lErr").textContent = m; $("#lErr").hidden = !m; }
$("#gBtn").onclick = async () => {
  lErr("");
  if (AND) { openExt(LOGIN_URL); lErr('Browser khul gaya hai: wahan apni Gmail chunein, phir "Power Haazri kholein" dabayein.'); return; }
  try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { if (e.code !== "auth/popup-closed-by-user") lErr("Login nahi hua: " + (e.code || e.message)); }
};
window.__onAuthToken = async t => {
  if (!t) return; lErr("Login ho raha hai…");
  try { await signInWithCredential(auth, GoogleAuthProvider.credential(t)); lErr(""); }
  catch (e) { lErr("Login nahi hua (" + (e.code || e.message) + "). Dobara koshish karein."); }
};
if (AND && AND.pendingToken) { const t = AND.pendingToken(); if (t) window.__onAuthToken(t); }
$("#out").onclick = async () => { $("#menu").hidden = true; if (await ask("Logout karein?", "Dobara aane ke liye Gmail se login karna hoga.", "Logout")) signOut(auth); };

onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = [];
  if (!user) { $("#login").hidden = false; $("#app").hidden = true; closeDetail(); return; }
  if (user.email !== OWNER_EMAIL) { lErr(`Yeh panel sirf ${OWNER_EMAIL} ke liye hai.`); signOut(auth); return; }
  $("#who").textContent = user.email; $("#login").hidden = true; $("#app").hidden = false; lErr("");
  const h = new Date().getHours();
  $("#greet").innerHTML = `${h < 12 ? "Subah bakhair" : h < 17 ? "Assalam o Alaikum" : "Shaam bakhair"}, <b>Nasir Khan</b>`;

  unsubs.push(onSnapshot(collection(db, "licenses"), s => { schools = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, e => toast("Schools load nahi hue: " + e.code)));

});

/* ---------- Status ---------- */
function status(l) {
  if (l.locked) return ["Band", "c-bad"];
  if (l.life) return ["Lifetime", "c-ok"];
  const end = l.validUntil?.toMillis?.() || 0, now = Date.now();
  if (now < end) { const left = Math.ceil((end - now) / DAY); return [left <= 7 ? `${left} din baqi` : "Active", left <= 7 ? "c-warn" : "c-ok"]; }
  if (now < end + GRACE_DAYS * DAY) return ["Mohlat", "c-warn"];
  return ["Khatam", "c-bad"];
}
const validTxt = l => l.life ? "Hamesha" : l.validUntil ? fmt(l.validUntil.toMillis()) + " tak" : "—";
const schoolRow = l => { const [st, cls] = status(l); return `<button class="row" data-sid="${esc(l.id)}"><span class="av">${esc(initials(l.schoolName))}</span><span class="grow"><b>${esc(l.schoolName || "School")}</b><span>${esc(l.id)} · ${TYPE[l.type] || "—"} · ${validTxt(l)}</span></span><span class="end"><span class="chip ${cls}">${st}</span></span>${ic("chev", "ic chev")}</button>`; };

/* ---------- Render ---------- */
function render() {
  const S = schools.map(l => ({ l, s: status(l) }));
  const active = S.filter(x => ["c-ok", "c-warn"].includes(x.s[1])).length;
  const warnN = S.filter(x => x.s[1] === "c-warn").length, badN = S.filter(x => x.s[1] === "c-bad").length;
  const earned = keys.filter(k => k.used).reduce((a, k) => a + (Number(k.amount) || 0), 0);
  $("#stats").innerHTML = [
    ["school", "t-blue", schools.length, "Kul schools"], ["check", "t-ok", active, "Chalu schools"],
    ["key", "t-warn", keys.filter(k => !k.used).length, "Na-istemal keys"], ["rs", "t-vio", "Rs " + earned.toLocaleString(), "Kul kamai"]
  ].map(([i, t, b, s]) => `<div class="stat"><i class="${t}">${ic(i)}</i><div><b>${b}</b><span>${s}</span></div></div>`).join("");

  // Home: attention list
  const attn = S.filter(x => x.s[1] !== "c-ok").sort((a, b) => (a.l.validUntil?.toMillis?.() || 0) - (b.l.validUntil?.toMillis?.() || 0)).slice(0, 6);
  $("#attn").innerHTML = attn.length ? attn.map(x => schoolRow(x.l)).join("") : `<div class="empty">${ic("check")}<br>Sab schools theek chal rahe hain.</div>`;
  $("#recentKeys").innerHTML = keys.length ? keys.slice(0, 5).map(keyRow).join("") : `<div class="empty">Abhi koi key nahi bani.<br><button class="btn sm gold" data-go="newkey" style="margin-top:10px">Nayi key banayein</button></div>`;

  // Schools
  $("#sFilt").innerHTML = [["all", "Sab", schools.length], ["ok", "Chalu", S.filter(x => x.s[1] === "c-ok").length], ["warn", "Jald khatam / mohlat", warnN], ["bad", "Khatam / band", badN]]
    .map(([f, t, n]) => `<button data-f="${f}" class="${sFilter === f ? "on" : ""}">${t}<em>${n}</em></button>`).join("");
  const q = ($("#sSearch").value || "").trim().toLowerCase(), F = { ok: "c-ok", warn: "c-warn", bad: "c-bad" }[sFilter];
  const list = S.sort((a, b) => (b.l.createdAt || 0) - (a.l.createdAt || 0))
    .filter(x => !q || [x.l.schoolName, x.l.id, x.l.ownerEmail, x.l.phone].some(v => String(v || "").toLowerCase().includes(q)))
    .filter(x => !F || x.s[1] === F);
  $("#schList").innerHTML = list.length ? list.map(x => schoolRow(x.l)).join("") : `<div class="empty" style="grid-column:1/-1">${schools.length ? "Is talash/filter mein koi school nahi." : "Abhi koi school register nahi hua."}</div>`;

  // Keys
  const unused = keys.filter(k => !k.used).length;
  $("#kFilt").innerHTML = [["all", "Sab", keys.length], ["new", "Na-istemal", unused], ["used", "Istemal shuda", keys.length - unused]]

/* ---------- School ka data ---------- */
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const tm = ms => ms ? new Date(ms).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";
async function viewSchool(l) {
  const m = modal(`<h3>${esc(l.schoolName)}</h3><p class="sub">Data load ho raha hai…</p>`, true);
  try {
    const sid = l.id, sub = n => collection(db, "schools", sid, n);
    const [sc, users, studs, att, sms] = await Promise.all([
      getDoc(doc(db, "schools", sid)), getDocs(query(collection(db, "users"), where("schoolId", "==", sid))),
      getDocs(sub("students")), getDocs(query(sub("attendance"), where("date", "==", today()))),
      getDocs(query(sub("sms_queue"), orderBy("ts", "desc"), limit(40)))]);
    const S2 = sc.data() || {}, st = studs.docs.map(d => d.data()).sort((a, b) => String(a.cls).localeCompare(String(b.cls), undefined, { numeric: true }) || String(a.name).localeCompare(String(b.name)));
    const at = att.docs.map(d => d.data()), sm = sms.docs.map(d => d.data());
    const cnt = k => sm.filter(x => x.status === k).length;
    const present = at.filter(x => x.in).length, late = at.filter(x => x.status === "late").length;
    m.innerHTML = `<div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">${S2.logo ? `<img src="${S2.logo}" style="width:48px;height:48px;object-fit:contain;border-radius:12px;border:1px solid var(--line)">` : `<span class="av">${esc(initials(l.schoolName))}</span>`}<div style="flex:1;min-width:0"><h3 style="margin:0">${esc(S2.schoolName || l.schoolName)}</h3><span class="muted" style="font-size:.8rem">ID ${esc(sid)} · ${esc(S2.phone || "")} · ${esc(S2.address || "")}</span></div><button class="ibtn" id="vX" style="background:var(--paper);color:var(--text)" aria-label="Band">✕</button></div>
      <div class="minis"><div><b>${st.length}</b><span>Students</span></div><div><b>${present}</b><span>Aaj aaye</span></div><div><b>${late}</b><span>Aaj late</span></div><div><b>${cnt("sent")}/${cnt("pending") + cnt("sending")}/${cnt("failed")}</b><span>SMS gaye/queue/fail</span></div></div>
      <div class="sec" style="margin-top:6px"><h3>Admins</h3></div><div class="tablewrap"><table>${users.docs.map(d => { const u = d.data(); return `<tr><td>${esc(u.email)}</td><td>${d.id === S2.ownerUid ? "Main admin" : "Admin"}</td><td class="muted">${tm(u.joinedAt)}</td></tr>`; }).join("") || `<tr><td class="muted">Koi nahi</td></tr>`}</table></div>
      <div class="sec"><h3>Aaj ki haazri (${today()})</h3></div><div class="tablewrap"><table><tr><th>ID</th><th>Naam</th><th>Class</th><th>Aamad</th><th>Rawangi</th><th>Status</th></tr>${at.sort((a, b) => String(a.in || "").localeCompare(String(b.in || ""))).map(x => `<tr><td>${esc(x.sid)}</td><td>${esc(x.name)}</td><td>${esc(x.cls)}</td><td>${esc(x.in || "")}</td><td>${esc(x.out || "")}</td><td>${esc(x.status || "")}</td></tr>`).join("") || `<tr><td class="muted" colspan="6">Aaj abhi koi scan nahi</td></tr>`}</table></div>
      <div class="sec"><h3>Haal hi ke SMS</h3></div><div class="tablewrap"><table><tr><th>Waqt</th><th>Student</th><th>Number</th><th>Qisam</th><th>Status</th></tr>${sm.map(x => `<tr><td>${tm(x.ts)}</td><td>${esc(x.name)}</td><td>${esc(x.to)}</td><td>${esc(x.type)}</td><td>${esc(x.status)}${x.error ? `<br><span class="muted" style="font-size:.76rem">${esc(x.error)}</span>` : ""}</td></tr>`).join("") || `<tr><td class="muted" colspan="5">Koi SMS nahi</td></tr>`}</table></div>
      <div class="sec"><h3>Students (${st.length})</h3><button class="btn sm" id="vCsv">${ic("dl")}CSV</button></div>
      <div class="tablewrap"><table><tr><th>ID</th><th>Naam</th><th>Walid</th><th>Class</th><th>Parent phone</th><th>PIN</th></tr>${st.map(x => `<tr><td>${esc(x.id)}</td><td>${esc(x.name)}${x.active === false ? ' <span class="chip c-grey">band</span>' : ""}</td><td>${esc(x.father)}</td><td>${esc(x.cls)}${x.section ? "-" + esc(x.section) : ""}</td><td>${esc(x.phone)}</td><td>${esc(x.pin)}</td></tr>`).join("") || `<tr><td class="muted" colspan="6">Koi student nahi</td></tr>`}</table></div>`;
    m.querySelector("#vX").onclick = closeModal;
    m.querySelector("#vCsv").onclick = () => csvDl(`${sid}-students.csv`, [["id", "name", "father", "class", "section", "phone", "pin", "active"], ...st.map(x => [x.id, x.name, x.father, x.cls, x.section, x.phone, x.pin, x.active !== false ? "yes" : "no"])]);
  } catch (e) { m.innerHTML = `<h3>Data load nahi hua</h3><p class="sub">${esc(e.code || e.message)}</p><div class="mfoot"><button class="btn" id="vX">Band</button></div>`; m.querySelector("#vX").onclick = closeModal; }
}

/* ---------- Reset / Delete ---------- */
async function delAll(refs) { for (let i = 0; i < refs.length; i += 400) { const b = writeBatch(db); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); } }
async function wipe(sid, full) {
  const refs = [];
  for (const n of ["students", "attendance", "sms_queue", "daily"]) (await getDocs(collection(db, "schools", sid, n))).docs.forEach(d => refs.push(d.ref));
  (await getDocs(query(collection(db, "portal"), where("schoolId", "==", sid)))).docs.forEach(d => refs.push(d.ref));
  if (full) {
    (await getDocs(query(collection(db, "users"), where("schoolId", "==", sid)))).docs.forEach(d => refs.push(d.ref));
    refs.push(doc(db, "schools", sid), doc(db, "licenses", sid));
  }
  await delAll(refs); return refs.length;
}
function askWipe(l, full) {
  const m = modal(`<h3 style="color:var(--bad)">${full ? "School account DELETE" : "School ka data RESET"}</h3>
    <p class="sub"><b>${esc(l.schoolName)}</b> — ${full ? "school, us ke admins (Gmail link), license, students, haazri, SMS aur parent portal — <b>sab kuch</b> hamesha ke liye delete. Woh Gmail dobara naya school bana sakegi." : "students, haazri, SMS aur parent portal delete. School, settings, admins aur license rahenge."} <b>Yeh wapas nahi hoga.</b></p>
    <label class="field"><span>Tasdeeq ke liye School ID <b>${esc(l.id)}</b> likhein</span><input class="input mono" id="wIn" autocomplete="off" autocapitalize="characters"></label>
    <div class="mfoot"><button class="btn" id="mX">Wapas</button><button class="btn dfill" id="mOk" disabled>${full ? "Delete karein" : "Reset karein"}</button></div>`);
  const inp = m.querySelector("#wIn"), ok = m.querySelector("#mOk");
  inp.oninput = () => { ok.disabled = inp.value.trim().toUpperCase() !== l.id.toUpperCase(); };
  m.querySelector("#mX").onclick = closeModal;
  ok.onclick = async () => { ok.disabled = true; ok.textContent = "Ho raha hai…"; try { const n = await wipe(l.id, full); closeModal(); if (full) closeDetail(); toast(`${full ? "Delete" : "Reset"} ho gaya (${n} record)`); } catch (e) { closeModal(); toast("Nahi hua: " + (e.code || e.message)); } };
}
